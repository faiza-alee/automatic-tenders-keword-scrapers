# GB-PPRA Tender Taxonomy
# Designed from the original taxonomy and reviewed against the supplied 253 GB-PPRA tender records.
# Version: 2026.17
# Categories describe WHAT is being procured or delivered, not the notice workflow.
# Tender title/description are primary evidence; department is supporting context only.
# Multi-category assignment is appropriate only when distinct procurement components are evidenced.
# Generic titles require description/BOQ evidence; otherwise use fallback category Other.
# Terms are canonical phrases; normalize case and singular/plural during matching.
# Compatibility: retains the original name/group/terms structure and all 22 category names.

version: '2026.8'
fallback_category: Other
categories:
