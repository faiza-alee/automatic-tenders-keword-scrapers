    group: Works
    terms: ["road", "roadway", "link road", "farm to market road", "widening", "re carpeting", "recarpeting", "metalling", "blacktopping", "pavement", "bridge", "foot bridge", "culvert", "protective bund", "protection wall", "retaining wall", "stone masonry", "building construction", "construction of building", "office building", "residential building", "public toilet", "demolishing", "demolition", "reconstruction", "rehabilitation", "civil work", "construction work", "building works", "structural works", "development work", "infrastructure development", "boundary wall", "working plan office", "building maintenance", "embankment", "foot bridge construction", "link road construction", "rcc bridge", "road carpeting", "road rehabilitation", "road widening", "boundary wall construction", "building demolition", "building rehabilitation", "check post construction", "government building", "office building construction", "park improvement", "park infrastructure", "public building", "public toilet construction", "recreational facility development", "residential building construction", "vocational center construction", "vocational centre construction", "waiting shed", "working plan office construction"]
